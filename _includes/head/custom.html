<!-- start custom head snippets -->

<style>
  html[data-theme="dark"] #page-title,
  html[data-theme="dark"] #page-title a,
  html[data-theme="dark"] .page__title,
  html[data-theme="dark"] .page__title a {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
  }
</style>

<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem("portfolio-theme");
      var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = savedTheme || (systemDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    } catch (error) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  }());
</script>
<script defer src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>

<!-- end custom head snippets -->
