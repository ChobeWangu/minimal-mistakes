<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Assembly of a synthetic porphyrin and an engineered protein scaffold into an artificial metalloenzyme</title>
  <desc id="desc">A three-stage scientific schematic showing an engineered four-helix protein scaffold, a synthetic iridium or zinc porphyrin cofactor, and the assembled artificial metalloenzyme creating a shaped catalytic microenvironment.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f1ede3"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d66f65"/>
      <stop offset="1" stop-color="#a64752"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102a43" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#c89b3c"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="660" rx="28" fill="url(#panel)" stroke="#dfd8c8" stroke-width="2"/>
  <text x="60" y="70" fill="#102a43" font-family="Georgia,serif" font-size="34" font-weight="700">From molecular components to an artificial metalloenzyme</text>
  <text x="60" y="106" fill="#526d82" font-family="Arial,sans-serif" font-size="18">The protein scaffold positions a synthetic metal cofactor inside a defined catalytic environment.</text>

  <!-- Stage 1 -->
  <g transform="translate(60 150)">
    <text x="0" y="0" fill="#c89b3c" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 · ENGINEER</text>
    <text x="0" y="35" fill="#102a43" font-family="Georgia,serif" font-size="25" font-weight="700">Protein scaffold</text>
    <g transform="translate(25 75)" filter="url(#shadow)">
      <rect x="0" y="18" width="54" height="240" rx="27" fill="url(#helix)" transform="rotate(-7 27 138)"/>
      <path d="M12 47C38 61 38 77 12 91S-14 121 12 135s26 30 0 44-26 30 0 44" fill="none" stroke="#f3b2a6" stroke-width="7" stroke-linecap="round" transform="rotate(-7 27 138)"/>
      <rect x="73" y="0" width="54" height="250" rx="27" fill="url(#helix)" transform="rotate(5 100 125)"/>
      <path d="M85 30c26 14 26 30 0 44s-26 30 0 44 26 30 0 44-26 30 0 44" fill="none" stroke="#f3b2a6" stroke-width="7" stroke-linecap="round" transform="rotate(5 100 125)"/>
      <rect x="146" y="12" width="54" height="242" rx="27" fill="url(#helix)" transform="rotate(-4 173 133)"/>
      <path d="M158 42c26 14 26 30 0 44s-26 30 0 44 26 30 0 44-26 30 0 44" fill="none" stroke="#f3b2a6" stroke-width="7" stroke-linecap="round" transform="rotate(-4 173 133)"/>
      <rect x="219" y="4" width="54" height="250" rx="27" fill="url(#helix)" transform="rotate(7 246 129)"/>
      <path d="M231 34c26 14 26 30 0 44s-26 30 0 44 26 30 0 44-26 30 0 44" fill="none" stroke="#f3b2a6" stroke-width="7" stroke-linecap="round" transform="rotate(7 246 129)"/>
    </g>
    <text x="0" y="390" fill="#526d82" font-family="Arial,sans-serif" font-size="17">Engineered cytochrome b₅₆₂</text>
    <text x="0" y="416" fill="#526d82" font-family="Arial,sans-serif" font-size="17">creates a tunable binding pocket.</text>
  </g>

  <path d="M365 333H445" fill="none" stroke="#c89b3c" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(465 150)">
    <text x="0" y="0" fill="#c89b3c" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">02 · INSERT</text>
    <text x="0" y="35" fill="#102a43" font-family="Georgia,serif" font-size="25" font-weight="700">Synthetic cofactor</text>
    <g transform="translate(40 115)" filter="url(#shadow)">
      <circle cx="115" cy="115" r="105" fill="#fff" stroke="#596fa8" stroke-width="10"/>
      <rect x="50" y="50" width="130" height="130" rx="28" fill="none" stroke="#596fa8" stroke-width="13" transform="rotate(45 115 115)"/>
      <circle cx="115" cy="115" r="37" fill="#102a43" stroke="#c89b3c" stroke-width="8"/>
      <text x="115" y="124" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Ir / Zn</text>
      <circle cx="115" cy="22" r="8" fill="#a75d5d"/>
      <circle cx="208" cy="115" r="8" fill="#a75d5d"/>
      <circle cx="115" cy="208" r="8" fill="#a75d5d"/>
      <circle cx="22" cy="115" r="8" fill="#a75d5d"/>
    </g>
    <text x="0" y="390" fill="#526d82" font-family="Arial,sans-serif" font-size="17">Iridium or zinc porphyrin supplies</text>
    <text x="0" y="416" fill="#526d82" font-family="Arial,sans-serif" font-size="17">the non-natural metal centre.</text>
  </g>

  <path d="M750 333H830" fill="none" stroke="#c89b3c" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g transform="translate(850 150)">
    <text x="0" y="0" fill="#c89b3c" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">03 · ASSEMBLE</text>
    <text x="0" y="35" fill="#102a43" font-family="Georgia,serif" font-size="25" font-weight="700">Catalytic system</text>
    <g transform="translate(15 80)" filter="url(#shadow)">
      <ellipse cx="145" cy="135" rx="130" ry="120" fill="#e9eef6" stroke="#829ab1" stroke-width="3"/>
      <rect x="18" y="18" width="42" height="235" rx="21" fill="url(#helix)" transform="rotate(-11 39 135)"/>
      <rect x="72" y="8" width="42" height="245" rx="21" fill="url(#helix)" transform="rotate(6 93 130)"/>
      <rect x="176" y="8" width="42" height="245" rx="21" fill="url(#helix)" transform="rotate(-6 197 130)"/>
      <rect x="230" y="18" width="42" height="235" rx="21" fill="url(#helix)" transform="rotate(11 251 135)"/>
      <circle cx="145" cy="135" r="72" fill="#fff" stroke="#596fa8" stroke-width="8"/>
      <rect x="100" y="90" width="90" height="90" rx="20" fill="none" stroke="#596fa8" stroke-width="10" transform="rotate(45 145 135)"/>
      <circle cx="145" cy="135" r="27" fill="#102a43" stroke="#c89b3c" stroke-width="6"/>
      <text x="145" y="142" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">M</text>
      <path d="M145 104V70" stroke="#c89b3c" stroke-width="4" stroke-dasharray="6 5"/>
      <circle cx="145" cy="60" r="10" fill="#c89b3c"/>
    </g>
    <text x="0" y="390" fill="#526d82" font-family="Arial,sans-serif" font-size="17">The scaffold controls access and</text>
    <text x="0" y="416" fill="#526d82" font-family="Arial,sans-serif" font-size="17">the environment around the metal.</text>
  </g>

  <g transform="translate(60 595)">
    <rect x="0" y="-36" width="1080" height="64" rx="16" fill="#102a43"/>
    <text x="30" y="3" fill="#f2d58c" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">DESIGN PRINCIPLE</text>
    <text x="220" y="3" fill="#fff" font-family="Arial,sans-serif" font-size="18">Combine synthetic-metal reactivity with the selectivity and mild conditions offered by a protein.</text>
  </g>
</svg>