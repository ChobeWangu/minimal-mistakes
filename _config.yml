minimal_mistakes_skin: "contrast"
locale: "en-GB"
title: "Chobe Wangu"
title_separator: "·"
subtitle: "Science, purpose and possibility"
name: "Choonzo Chiyumba"
description: "The personal and professional portfolio of Choonzo Chiyumba — chemist, researcher and sustainable-development thinker."
url: "https://chobewangu.space"
baseurl: ""
repository: "ChobeWangu/minimal-mistakes"
masthead_title: "Chobe Wangu"
breadcrumbs: false
words_per_minute: 200
search: false

social:
  type: Person
  name: "Choonzo Chiyumba"
  links:
    - "https://github.com/ChobeWangu"

author:
  name: "Choonzo Chiyumba"
  bio: "Chemist · Researcher · Sustainable-development thinker"
  location: "Cambridge, United Kingdom"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ChobeWangu"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ChobeWangu"
  since: "2026"

include:
  - _pages

exclude:
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - docs
  - test
  - CHANGELOG.md
  - Rakefile
  - package.json
  - package-lock.json

encoding: "utf-8"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: "Europe/London"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide
